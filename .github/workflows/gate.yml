#
# The merge gate: exactly what `npm run gate` runs locally, so a green local run
# and a green CI run mean the same thing. If these ever diverge, fix the
# divergence rather than adding a CI-only step.
name: Gate

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      # NEH-249 needed `submodules: recursive` here, because
      # packages/stonedog-style was a submodule that jest's moduleNameMapper
      # pointed inside. NEH-1004 moved @stonedogcode/style to the registry and
      # this repo now has NO submodules at all, so the option is gone with the
      # thing it existed for. `npm ci` fetches the package.
      #
      # The lesson survives the submodule: that failure showed up only in CI,
      # because every local checkout had the directory populated. Anything the
      # gate depends on must be fetched by a step the gate runs, not inherited
      # from a developer's disk.
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Rule validation and barrel freshness run FIRST. A schema-invalid or
      # unregenerated rule produces confusing failures further down, and these
      # two name the actual problem.
      - run: npm run rules:validate
      - run: npm run rules:barrel:check
      - run: npm run type-check
      - run: npm run lint
      - run: npm test

  e2e:
    # The tier jsdom cannot substitute for (NEH-373). It BLOCKS, like `gate` —
    # this repo is public, so branch protection works here, and a tier that
    # only runs on somebody's laptop is documentation rather than a gate.
    #
    # A separate job rather than another step in `gate`, for two reasons: it
    # needs a browser download that the unit tier should not pay for, and a
    # failure here should be legible as "the journey broke" rather than buried
    # at the end of a five-step run.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Chromium only. The mobile project is a 375px viewport in Chromium
      # rather than WebKit — see the config for why — so a second browser
      # would be downloaded and never launched.
      - run: npx playwright install --with-deps chromium
      # Builds the app first (the config's `webServer` runs `next build &&
      # next start`), so this exercises the PRODUCTION build, not a dev server.
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        # Only on failure: traces and screenshots are large, and a green run
        # produces artefacts nobody opens.
        if: failure()
        with:
          name: playwright-artifacts
          path: apps/web/e2e/.artifacts/
          retention-days: 7

  staleness:
    # Reports; never fails the build. A rule going stale is a fact about the
    # calendar, not about this change, and a gate that goes red on the passage
    # of time gets disabled within a month — at which point the signal is gone.
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run rules:staleness
